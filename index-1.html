
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<meta name="theme-color" content="#10141c">

<title>ALMAS CHART SIMULATOR</title>

<style>
:root{
 --bg:#0b1017;
 --panel:#121a24;
 --panel2:#182331;
 --border:#273445;
 --text:#e8edf4;
 --muted:#8292a6;
 --green:#00c087;
 --red:#ff5268;
 --blue:#4389ff;
 --gold:#f4c35b;
 --purple:#9c70ff;
 --radius:14px;
}

*{
 box-sizing:border-box;
}

body{
 margin:0;
 padding:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,sans-serif;
}

button,input,select{
 font-family:inherit;
}

button{
 cursor:pointer;
 transition:.2s;
}

button:hover{
 filter:brightness(1.12);
}

button:active{
 transform:scale(.97);
}

#app{
 width:100%;
 max-width:1500px;
 margin:auto;
 padding:12px;
}

.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 flex-wrap:wrap;
 gap:12px;
 padding:14px;
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:var(--radius);
}

.ticker{
 display:flex;
 flex-direction:column;
 gap:5px;
}

.symbol{
 font-size:19px;
 font-weight:bold;
}

.price{
 font-size:24px;
 font-weight:bold;
 direction:ltr;
 text-align:right;
}

.wallet{
 display:flex;
 flex-direction:column;
 gap:6px;
 background:var(--panel2);
 padding:12px;
 border-radius:12px;
}

.wallet b{
 color:var(--gold);
 direction:ltr;
}

.toolbar{
 margin-top:12px;
 padding:10px;
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:var(--radius);
}

#tscroll{
 display:flex;
 gap:7px;
 overflow-x:auto;
}

#tscroll button{
 flex-shrink:0;
 background:var(--panel2);
 border:1px solid var(--border);
 color:var(--text);
 padding:10px 14px;
 border-radius:9px;
}

#tscroll button.active{
 background:var(--blue);
 color:white;
}

#chartwrap{
 position:relative;
 height:450px;
 margin-top:12px;
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:var(--radius);
 overflow:hidden;
}

#chart{
 width:100%;
 height:100%;
}

#alertbar{
 display:none;
 position:absolute;
 top:10px;
 left:10px;
 right:10px;
 z-index:5;
 padding:10px;
 background:var(--gold);
 color:#111;
 border-radius:10px;
 font-weight:bold;
}

#hint{
 position:absolute;
 bottom:10px;
 right:10px;
 color:var(--muted);
 font-size:12px;
 pointer-events:none;
}

#tools{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-top:12px;
 padding:12px;
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:var(--radius);
}

#tools button{
 background:var(--panel2);
 color:var(--text);
 border:1px solid var(--border);
 padding:10px 12px;
 border-radius:9px;
}

#tools button.active{
 border-color:var(--blue);
 background:#203a60;
}

.main-grid{
 display:grid;
 grid-template-columns:
 repeat(auto-fit,minmax(240px,1fr));
 gap:12px;
 margin-top:12px;
}

.panel{
 padding:15px;
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:var(--radius);
 min-width:0;
}

.panel-title{
 font-weight:bold;
 margin-bottom:12px;
 font-size:15px;
}

.stat{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:10px 0;
 border-bottom:1px solid var(--border);
 gap:10px;
}

.stat:last-child{
 border-bottom:none;
}

.stat span{
 color:var(--muted);
}

.stat b{
 direction:ltr;
}

.actions{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
}

.actions button{
 flex:1;
 min-width:120px;
}

.btn{
 padding:11px;
 border:0;
 border-radius:9px;
 font-weight:bold;
 color:white;
}

.btn-blue{
 background:var(--blue);
}

.btn-green{
 background:var(--green);
 color:#06140f;
}

.btn-red{
 background:var(--red);
}

.btn-gold{
 background:var(--gold);
 color:#211600;
}

.btn-purple{
 background:var(--purple);
}

.btn-neutral{
 background:var(--panel2);
 color:var(--text);
 border:1px solid var(--border);
}

input,select{
 width:100%;
 padding:11px;
 background:var(--bg);
 color:var(--text);
 border:1px solid var(--border);
 border-radius:9px;
 outline:none;
}

input:focus,select:focus{
 border-color:var(--blue);
}

.field{
 margin-bottom:12px;
}

.field label{
 display:block;
 margin-bottom:7px;
 color:var(--muted);
 font-size:13px;
}

#toast{
 position:fixed;
 bottom:22px;
 left:50%;
 transform:translateX(-50%);
 z-index:999;
 display:none;
 padding:12px 18px;
 background:#263548;
 color:white;
 border:1px solid var(--border);
 border-radius:12px;
 max-width:90%;
 text-align:center;
}

.sheet{
 display:none;
 position:fixed;
 inset:0;
 z-index:100;
 background:rgba(0,0,0,.75);
 align-items:center;
 justify-content:center;
 padding:15px;
}

.card{
 width:100%;
 max-width:480px;
 max-height:90vh;
 overflow-y:auto;
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:16px;
 padding:18px;
}

.card-header{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 margin-bottom:15px;
}

.card-header h3{
 margin:0;
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}

.row{
 display:flex;
 align-items:center;
 gap:8px;
 flex-wrap:wrap;
}

.fl{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}

.note{
 color:var(--muted);
 font-size:12px;
 line-height:1.8;
}

.divider{
 border:0;
 border-top:1px solid var(--border);
 margin:14px 0;
}

.badge{
 display:inline-block;
 padding:5px 8px;
 background:var(--panel2);
 border-radius:7px;
 font-size:11px;
}

.status{
 color:var(--green);
}

.section{
 margin-top:12px;
}

.two{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}

@media(max-width:600px){
 #app{
  padding:7px;
 }

 #chartwrap{
  height:350px;
 }

 .top{
  padding:10px;
 }

 .price{
  font-size:20px;
 }

 .panel{
  padding:12px;
 }
}

</style>
</head>

 theme:"dark",

 symbol:DEFAULT_SYMBOL,

 settings:{},

const defaultSettings = {

 chartHeight:450,

 animation:true,

 sound:false,

 notifications:false,

 showGrid:true,

 showCrosshair:true,

 showPriceScale:true,

 showTimeScale:true,

 autoSave:true,

 decimalPlaces:2,

/* ---------- UTILITY FUNCTIONS ---------- */

function getElement(id){

 return document.getElementById(id);

}

function safeNumber(value,fallback=0){

 const number=Number(value);

 if(!Number.isFinite(number)){
  return fallback;
 }

 return number;

}

function clampNumber(value,min,max){

 const number=safeNumber(value,min);

 return Math.min(max,Math.max(min,number));

}

function roundNumber(value,precision=2){

 const factor=Math.pow(10,precision);

 return Math.round(safeNumber(value)*factor)/factor;

}

function formatNumber(value,precision=2){

 const number=safeNumber(value);

 return number.toLocaleString("en-US",{

  minimumFractionDigits:precision,

  maximumFractionDigits:precision

 });

}

function formatCurrency(value,currency="USDT"){

 return formatNumber(value,2)+" "+currency;

}

 return Date.now();

function getCurrentDate(){

 return new Date().toISOString();

}

function isObject(value){

 return value!==null&&
  typeof value==="object"&&
  !Array.isArray(value);

}

function deepClone(value){

 return JSON.parse(JSON.stringify(value));

}

/* ---------- SETTINGS MANAGEMENT ---------- */

function createDefaultSettings(){

 return deepClone(defaultSettings);

}

function mergeSettings(existing){

 const defaults=createDefaultSettings();

 if(!isObject(existing)){
  return defaults;
 }

 const merged={...defaults,...existing};

 if(isObject(existing.display)){
  merged.display={
   ...defaults.display,
   ...existing.display
  };
 }

 if(isObject(existing.calculations)){
  merged.calculations={
   ...defaults.calculations,
   ...existing.calculations
  };
 }

 if(isObject(existing.chartColors)){
  merged.chartColors={
   ...defaults.chartColors,
   ...existing.chartColors
  };
 }

 if(isObject(existing.candleColors)){
  merged.candleColors={
   ...defaults.candleColors,
   ...existing.candleColors
  };
 }

 return merged;

}

function validateSettings(settings){

 if(!isObject(settings)){
  return false;
 }

 if(settings.theme!=="dark"&&
    settings.theme!=="light"){
  return false;
 }

 if(!Number.isFinite(
    safeNumber(settings.chartHeight))){
  return false;
 }

 if(settings.chartHeight<200||
    settings.chartHeight>1000){
  return false;
 }

 return true;

}

function validateCapital(value){

 return capital>0&&capital<=1000000000;

}

function validatePercentage(value){

 if(!Number.isFinite(percentage)){
  return false;
 }

 return percentage>=-100&&percentage<=1000;

/* ---------- STORAGE HELPERS ---------- */

function storageAvailable(){

 try{

  const key="almas_storage_test";

  localStorage.setItem(key,"1");

  localStorage.removeItem(key);

  return true;

 }catch(error){

  return false;

 }

}

function storageKey(name){

 return STORAGE_NAMESPACE+"_"+name;

}

function writeStorage(name,value){

 if(!storageAvailable()){
  return false;
 }

 try{

  const serialized=JSON.stringify(value);

  localStorage.setItem(
   storageKey(name),
   serialized
  );

  return true;

 }catch(error){

  return false;

 }

}

function readStorage(name,fallback=null){

 if(!storageAvailable()){
  return fallback;
 }

 try{

  const serialized=localStorage.getItem(
   storageKey(name)
  );

  if(serialized===null){
   return fallback;
  }

  return JSON.parse(serialized);

 }catch(error){

  return fallback;

 }

}

function removeStorage(name){

 if(!storageAvailable()){
  return false;
 }

 try{

  localStorage.removeItem(
   storageKey(name)
  );

  return true;

 }catch(error){

  return false;

 }

}

function saveSettings(){

 const settings=appState.settings;

 if(!validateSettings(settings)){
  return false;
 }

 return writeStorage(
  "settings",
  settings
 );

}

function loadSettings(){

 const stored=readStorage(
  "settings",
  null
 );

 const merged=mergeSettings(stored);

 if(!validateSettings(merged)){
  appState.settings=createDefaultSettings();
  return false;
 }

 appState.settings=merged;

 appState.theme=merged.theme;

 return true;

}

function restoreSettings(){

 if(!success){

  appState.settings=createDefaultSettings();

 }

 return appState.settings;

}

function initializeCore(){

 };

/* ---------- CORE EVENTS ---------- */

function emitCoreEvent(name,data={}){

 const eventData={

  name:name,

  timestamp:getCurrentTimestamp(),

  data:data

 };

 appState.history.push(eventData);

 if(appState.history.length>500){

  appState.history.shift();

 }

 return eventData;

}

/* ---------- INITIAL CORE RUN ---------- */

initializeCore();

emitCoreEvent(
 "core_initialized",
 {

  mode:APP_MODE

<script>
/* ==========================================
   ALMAS CHART SIMULATOR
   PART 5 : DEMO DATA ENGINE
========================================== */

const DemoDataEngine = {

    candles:[],
    lastPrice:65000,
    count:300,

    reset(){
        this.candles=[];
        this.lastPrice=65000;
    },

    randomChange(){
        return (Math.random()-0.5)*180;
    },

    generateCandle(previous,time){

        const open=previous;
        const change=this.randomChange();
        const close=open+change;

        const spread=Math.random()*90;

        const high=Math.max(open,close)+spread;
        const low=Math.min(open,close)-spread;

        return {
            time:time,
            open:roundNumber(open,2),
            high:roundNumber(high,2),
            low:roundNumber(low,2),
            close:roundNumber(close,2)
        };
    },

    getInterval(){

        const intervals={
            "1m":60,
            "5m":300,
            "15m":900,
            "1h":3600,
            "4h":14400,
            "1d":86400
        };

        return intervals[appState.timeframe] || 60;
    },

    generate(count=300){

        this.reset();

        const interval=this.getInterval();

        const now=Math.floor(Date.now()/1000);

        let start=now-(count*interval);

        let price=this.lastPrice;

        const output=[];

        for(let i=0;i<count;i++){

            const candleTime=start+(i*interval);

            const candle=this.generateCandle(
                price,
                candleTime
            );

            output.push(candle);

            price=candle.close;
        }

        this.candles=output;

        this.lastPrice=price;

        return output;
    },

    append(){

        if(!this.candles.length){
            return null;
        }

        const interval=this.getInterval();

        const previous=this.candles[
            this.candles.length-1
        ];

        const newTime=previous.time+interval;

        const candle=this.generateCandle(
            previous.close,
            newTime
        );

        this.candles.push(candle);

        if(this.candles.length>1000){
            this.candles.shift();
        }

        return candle;
    },

    getLast(){

        if(!this.candles.length){
            return null;
        }

        return this.candles[
            this.candles.length-1
        ];
    },

    getData(){

        return this.candles.slice();
    },

    getCount(){

        return this.candles.length;
    },

    getAverage(){

        if(!this.candles.length){
            return 0;
        }

        const sum=this.candles.reduce(
            (total,candle)=>{
                return total+candle.close;
            },
            0
        );

        return sum/this.candles.length;
    },

    getHighest(){

        if(!this.candles.length){
            return 0;
        }

        return Math.max(
            ...this.candles.map(c=>c.high)
        );
    },

    getLowest(){

        if(!this.candles.length){
            return 0;
        }

        return Math.min(
            ...this.candles.map(c=>c.low)
        );
    }

};

function loadDemoCandles(){

    const data=DemoDataEngine.generate(300);

    setSimulationChartData(data);

    const last=DemoDataEngine.getLast();

    if(last){
        updateDemoPriceDisplay(last.close);
    }

    emitCoreEvent(
        "demo_data_loaded",
        {
            count:data.length
        }
    );

    return data;
}

function updateDemoPriceDisplay(price){

    const priceElement=getElement("price");

    if(priceElement){

        priceElement.textContent=
            formatNumber(price,2);
    }

    appState.lastPrice=price;
}

function appendDemoCandle(){

    const candle=DemoDataEngine.append();

    if(!candle){
        return false;
    }

    updateSimulationCandle(candle);

    updateDemoPriceDisplay(candle.close);

    emitCoreEvent(
        "demo_candle_added",
        {
            price:candle.close,
            time:candle.time
        }
    );

    return true;
}

function getDemoDataset(){

    return DemoDataEngine.getData();
}

function getDemoStatistics(){

    return {

        count:DemoDataEngine.getCount(),

        average:roundNumber(
            DemoDataEngine.getAverage(),
            2
        ),

        highest:roundNumber(
            DemoDataEngine.getHighest(),
            2
        ),

        lowest:roundNumber(
            DemoDataEngine.getLowest(),
            2
        ),

        last:DemoDataEngine.getLast()

    };
}

<script>
/* ==========================================

const DrawingManager = {

    activeTool:"cursor",

    items:[],

    startPoint:null,

    setTool(tool){

        const allowed=[
            "cursor",
            "line",
            "trend",
            "measure",
            "alert"
        ];

        if(!allowed.includes(tool)){
            return false;
        }

        this.activeTool=tool;

        appState.selectedTool=tool;

        this.updateToolButtons();

        emitCoreEvent(
            "drawing_tool_changed",
            {tool:tool}
        );

        return true;
    },

    updateToolButtons(){

        const buttons=document.querySelectorAll(
            "[data-tool]"
        );

        buttons.forEach(button=>{

            button.classList.toggle(
                "active",
                button.dataset.tool===this.activeTool
            );

        });

    },

    add(item){

        if(!item || typeof item!=="object"){
            return false;
        }

        const record={
            id:this.createId(),
            type:item.type || "line",
            createdAt:Date.now(),
            points:Array.isArray(item.points)
                ? item.points.slice()
                : [],
            color:item.color || "#60a5fa"
        };

        this.items.push(record);

        appState.drawings=this.items.slice();

        this.renderList();

        return record;
    },

    createId(){

        return "draw_"+Date.now()+"_"+
            Math.floor(Math.random()*10000);
    },

    remove(id){

        const index=this.items.findIndex(
            item=>item.id===id
        );

        if(index===-1){
            return false;
        }

        this.items.splice(index,1);

        appState.drawings=this.items.slice();

        this.renderList();

        return true;
    },

    clear(){

        this.items=[];

        appState.drawings=[];

        this.startPoint=null;

        this.renderList();

        emitCoreEvent(
            "drawings_cleared",
            {}
        );

    },

    getAll(){

        return this.items.slice();
    },

    count(){

        return this.items.length;
    },

    renderList(){

        const target=getElement("drawingList");

        if(!target){
            return;
        }

        if(!this.items.length){

            target.innerHTML=
                '<div class="empty-state">'+
                'ترسیمی ثبت نشده است'+
                '</div>';

            return;
        }

        target.innerHTML="";

        this.items.forEach(item=>{

            const row=document.createElement("div");

            row.className="list-item";

            const label=document.createElement("span");

            label.textContent=item.type;

            const remove=document.createElement("button");

            remove.className="small-btn";

            remove.textContent="حذف";

            remove.addEventListener(
                "click",
                ()=>this.remove(item.id)
            );

            row.appendChild(label);

            row.appendChild(remove);

            target.appendChild(row);

        });

    },

    export(){

        return JSON.stringify(
            this.items,
            null,
            2
        );
    },

    import(raw){

        try{

            const data=JSON.parse(raw);

            if(!Array.isArray(data)){
                return false;
            }

            this.items=data.filter(
                item=>item &&
                typeof item==="object"
            );

            appState.drawings=this.items.slice();

            this.renderList();

    calculate(data){

        if(!Array.isArray(data) || !data.length){

        const closes=data.map(
            candle=>candle.close
        );

        const highs=data.map(
            candle=>candle.high
        );

        const lows=data.map(
            candle=>candle.low
        );

        const sum=closes.reduce(
            (a,b)=>a+b,
            0
        );

        const average=sum/closes.length;

        const highest=Math.max(...highs);

        const lowest=Math.min(...lows);

        const last=data[data.length-1];

        return {

            average:roundNumber(average,2),

            highest:roundNumber(highest,2),

            lowest:roundNumber(lowest,2),

            range:roundNumber(
                highest-lowest,
                2
            ),

            count:data.length,

            lastPrice:last.close,

            formatNumber(stats.highest,2)

        this.setText(
            "statLow",
            formatNumber(stats.lowest,2)
        );

        this.setText(
            "statRange",
            formatNumber(stats.range,2)
        );

        this.setText(
            "statCount",
            formatNumber(stats.count)
        );

        this.setText(
            "statLast",
            formatNumber(stats.lastPrice,2)
        );

    },

    setText(id,value){

        if(element){

            "demo_indicator_toggled",

                enabled:value
            }

        return true;

    }

<script>
/* ==========================================
   ALMAS CHART SIMULATOR
   PART 9 : SCENARIO MANAGEMENT
========================================== */

const ScenarioManager = {

    scenarios:[],

    activeId:null,

    create(data={}){

        const scenario={

            id:this.makeId(),

            name:data.name ||
                "سناریوی آزمایشی "+(this.scenarios.length+1),

            createdAt:Date.now(),

            capital:safeNumber(
                data.capital,
                appState.initialCapital || DEFAULT_CAPITAL
            ),

            percentage:safeNumber(
                data.percentage,
                30
            ),

            notes:data.notes || "",

            status:"demo"

        };

        this.scenarios.push(scenario);

        this.activeId=scenario.id;

        appState.scenarioCount=this.scenarios.length;

        this.render();

        emitCoreEvent(
            "scenario_created",
            {
                id:scenario.id
            }
        );

        return scenario;

    },

    makeId(){

        return "scenario_"+Date.now()+"_"+
            Math.floor(Math.random()*9999);

    },

    find(id){

        return this.scenarios.find(
            item=>item.id===id
        ) || null;

    },

    select(id){

        const scenario=this.find(id);

        if(!scenario){
            return false;
        }

        this.activeId=id;

        this.render();

        return scenario;

    },

    remove(id){

        const index=this.scenarios.findIndex(
            item=>item.id===id
        );

        if(index===-1){
            return false;
        }

        this.scenarios.splice(index,1);

        if(this.activeId===id){
            this.activeId=null;
        }

        appState.scenarioCount=this.scenarios.length;

        this.render();

        return true;

    },

    clear(){

        this.scenarios=[];

        this.activeId=null;

        appState.scenarioCount=0;

        this.render();

    },

    update(id,changes){

        const scenario=this.find(id);

        if(!scenario){
            return false;
        }

        Object.assign(
            scenario,
            changes
        );

        this.render();

        return scenario;

    },

    getActive(){

        return this.find(this.activeId);

    },

    getAll(){

        return this.scenarios.slice();

    },

    render(){

        const container=getElement(
            "scenarioList"
        );

        if(!container){
            return;
        }

        container.innerHTML="";

        if(!this.scenarios.length){

            container.innerHTML=
                '<div class="empty-state">'+
                'سناریویی ایجاد نشده است'+
                '</div>';

            return;

        }

        this.scenarios.forEach(scenario=>{

            const card=document.createElement("div");

            card.className="panel";

            card.style.marginBottom="10px";

            const heading=document.createElement("div");

            heading.className="panel-header";

            const name=document.createElement("strong");

            name.textContent=scenario.name;

            heading.appendChild(name);

            const body=document.createElement("div");

            body.className="panel-subtitle";

            body.textContent=
                "سرمایه آزمایشی: "+
                formatNumber(scenario.capital);

            const actions=document.createElement("div");

            actions.className="panel-actions";

            const selectBtn=document.createElement("button");

            selectBtn.className="small-btn";

            selectBtn.textContent="انتخاب";

            selectBtn.addEventListener(
                "click",
                ()=>this.select(scenario.id)
            );

            const deleteBtn=document.createElement("button");

            deleteBtn.className="small-btn";

            deleteBtn.textContent="حذف";

            deleteBtn.addEventListener(
                "click",
                ()=>this.remove(scenario.id)
            );

            actions.appendChild(selectBtn);

            actions.appendChild(deleteBtn);

            card.appendChild(heading);

            card.appendChild(body);

            card.appendChild(actions);

            container.appendChild(card);

        });

    },

    exportData(){

        return JSON.stringify(
            this.scenarios,
            null,
            2
        );

    },

    importData(raw){

        try{

            const data=JSON.parse(raw);

            if(!Array.isArray(data)){
                return false;
            }

            this.scenarios=data.filter(
                item=>item &&
                typeof item==="object" &&
                typeof item.id==="string"
            );

            appState.scenarioCount=
                this.scenarios.length;

            this.activeId=null;

            this.render();

            return true;

        }catch(error){

            console.error(error);

            return false;

        }

    }

};

    });

}

}

        initializeScenarioManager();

    }

</script>

<script>
/* ==========================================
   ALMAS CHART SIMULATOR
   PART 12 : MONTHLY REPORT ENGINE
========================================== */

const MonthlyReportManager = {

    getMonthRecords(year,month){

        return DemoPnLManager.records.filter(
            record=>{

                const date=new Date(
                    record.createdAt
                );

                return date.getFullYear()===year &&
                    date.getMonth()===month;

            }
        );

    },

    calculate(records){

        if(!Array.isArray(records)){
            records=[];
        }

        let positive=0;
        let negative=0;
        let neutral=0;
        let total=0;

        records.forEach(record=>{

            const change=safeNumber(
                record.change,
                0
            );

            total+=change;

            if(change>0){
                positive++;
            }
            else if(change<0){
                negative++;
            }
            else{
                neutral++;
            }

        });

        return {

            count:records.length,

            positive:positive,

            negative:negative,

            neutral:neutral,

            total:roundNumber(total,2),

            average:records.length
                ? roundNumber(total/records.length,2)
                : 0

        };

    },

    getCurrent(){

        const now=new Date();

        const records=this.getMonthRecords(
            now.getFullYear(),
            now.getMonth()
        );

        return this.calculate(records);

    },

    render(report){

        const fields={
            reportCount:report.count,
            reportPositive:report.positive,
            reportNegative:report.negative,
            reportNeutral:report.neutral,
            reportTotal:formatNumber(report.total),
            reportAverage:formatNumber(report.average)
        };

        Object.entries(fields).forEach(
            ([id,value])=>{

                const element=getElement(id);

                if(element){
                    element.textContent=value;
                }

            }
        );

    },

    refresh(){

        const report=this.getCurrent();

        this.render(report);

        return report;

    },

    export(){

        const records=DemoPnLManager.records;

        return JSON.stringify(
            records,
            null,
            2
        );

    }

};

function getMonthlyDemoReport(){

    return MonthlyReportManager.getCurrent();

}

    return MonthlyReportManager.refresh();

}

    return MonthlyReportManager.export();

}

    function(){

    }
);

<script>
/* ==========================================
   ALMAS CHART SIMULATOR
   PART 13 : PERSISTENCE ENGINE
========================================== */

const PersistenceManager = {

    version:1,

    getKey(name){

        return STORAGE_NAMESPACE+
            "_"+name;
    },

    save(name,data){

        try{

            const key=this.getKey(name);

            const payload={
                version:this.version,
                savedAt:Date.now(),
                data:data
            };

            localStorage.setItem(
                key,
                JSON.stringify(payload)
            );

            return true;

        }catch(error){

            console.error(
                "Persistence save error:",
                error
            );

            return false;

        }

    },

    load(name){

        try{

            const key=this.getKey(name);

            const raw=localStorage.getItem(key);

            if(!raw){
                return null;
            }

            const payload=JSON.parse(raw);

            if(!payload ||
                !Object.prototype.hasOwnProperty.call(
                    payload,
                    "data"
                )
            ){

                return null;

            }

            return payload.data;

        }catch(error){

            console.error(
                "Persistence load error:",
                error
            );

            return null;

        }

    },

    remove(name){

        try{

            localStorage.removeItem(
                this.getKey(name)
            );

            return true;

        }catch(error){

            console.error(error);

            return false;

        }

    },

    saveAll(){

        const settings=appState.settings;

        const drawings=DrawingManager.getAll();

        const scenarios=ScenarioManager.getAll();

        const history=DemoPnLManager.getAll();

        const stateData={

            timeframe:appState.timeframe,

            capital:appState.initialCapital,

            selectedPercentage:
                DemoPercentageManager.get(),

            lastPrice:appState.lastPrice

        };

        const results={

            settings:this.save(
                "settings",
                settings
            ),

            drawings:this.save(
                "drawings",
                drawings
            ),

            scenarios:this.save(
                "scenarios",
                scenarios
            ),

            history:this.save(
                "history",
                history
            ),

            state:this.save(
                "state",
                stateData
            )

        };

        return Object.values(results).every(
            value=>value===true
        );

    },

    restoreAll(){

        const settings=this.load("settings");

        const drawings=this.load("drawings");

        const scenarios=this.load("scenarios");

        const history=this.load("history");

        const state=this.load("state");

        if(settings){

            appState.settings=mergeSettings(
                createDefaultSettings(),
                settings
            );

        }

        if(drawings){

            DrawingManager.import(
                JSON.stringify(drawings)
            );

        }

        if(scenarios){

            ScenarioManager.importData(
                JSON.stringify(scenarios)
            );

        }

        if(history && Array.isArray(history)){

            DemoPnLManager.records=
                history.slice();

            appState.history=
                history.slice();

        }

        if(state && typeof state==="object"){

            if(
                validateTimeframe(state.timeframe)
            ){

                appState.timeframe=
                    state.timeframe;

            }

            if(
                validateCapital(state.capital)
            ){

                appState.initialCapital=
                    state.capital;

            }

            if(
                [30,50].includes(
                    Number(state.selectedPercentage)
                )
            ){

                DemoPercentageManager.selected=
                    Number(state.selectedPercentage);

            }

            if(
                Number.isFinite(state.lastPrice)
            ){

                appState.lastPrice=
                    state.lastPrice;

            }

        }

        return true;

    },

    clearAll(){

        [
            "settings",
            "drawings",
            "scenarios",
            "history",
            "state"
        ].forEach(
            name=>this.remove(name)
        );

    }

};

function saveApplicationData(){

    return PersistenceManager.saveAll();

}

function restoreApplicationData(){

    return PersistenceManager.restoreAll();

}

function clearApplicationStorage(){

    PersistenceManager.clearAll();

}

function initializePersistence(){

    restoreApplicationData();

    DrawingManager.renderList();

    ScenarioManager.render();

    DemoPnLManager.render();

    DemoIndicators.refresh();

    DemoPercentageManager.render();

    TimeframeManager.updateButtons();

    emitCoreEvent(
        "persistence_restored",
        {}
    );

}

document.addEventListener(
    "DOMContentLoaded",
    function(){

        initializePersistence();

    }
);

window.addEventListener(
    "beforeunload",
    function(){

        saveApplicationData();

    }
);

</script>

<script>
/* ==========================================
   ALMAS CHART SIMULATOR
   PART 15 : FINAL INTEGRATION
========================================== */

const AlmasFinalManager = {

    running:false,

    interval:null,

    start(){

        if(this.running){
            return;
        }

        this.running=true;

        this.updateStatus("در حال راه‌اندازی");

        try{

            if(!initializeSimulationChart()){
                throw new Error("Chart initialization failed");
            }

            if(!DemoDataEngine.getCount()){
                loadDemoCandles();
            }

            this.refreshAll();

            this.running=true;

            this.updateStatus("شبیه‌سازی فعال");

            emitCoreEvent("simulator_started",{});

        }catch(error){

            this.running=false;

            this.updateStatus("خطا در راه‌اندازی");

            console.error(error);

            this.toast("راه‌اندازی کامل نشد");

        }

    },

    stop(){

        this.running=false;

        if(this.interval){

            clearInterval(this.interval);

            this.interval=null;

        }

        this.updateStatus("شبیه‌سازی متوقف");

        this.toast("شبیه‌سازی متوقف شد");

    },

    refreshAll(){

        try{

            TimeframeManager.updateButtons();

            DrawingManager.renderList();

            ScenarioManager.render();

            DemoPnLManager.render();

            DemoIndicators.refresh();

            DemoPercentageManager.render();

            MonthlyReportManager.refresh();

            DashboardManager.refresh();

            resizeSimulationChart();

        }catch(error){

            console.error("Refresh error:",error);

        }

    },

    updateStatus(message){

        const element=getElement(
            "finalStatus"
        );

        if(element){
            element.textContent=message;
        }

    },

    toast(message){

        if(typeof showToast==="function"){
            showToast(message);
            return;
        }

        const element=getElement("toast");

        if(element){

            element.textContent=message;

            element.style.display="block";

        }

    },

    check(){

        const checks={

            chart:!!simChart,

            candleSeries:!!simCandleSeries,

            chartData:
                DemoDataEngine.getCount()>0,

            settings:
                !!appState.settings,

            timeframe:
                validateTimeframe(
                    appState.timeframe
                )

        };

        return checks;

    },

    report(){

        const checks=this.check();

        const passed=Object.values(
            checks
        ).filter(Boolean).length;

        return {

            checks:checks,

            passed:passed,

            total:Object.keys(checks).length,

            complete:
                passed===Object.keys(checks).length

        };

    },

    toastReport(){

        const report=this.report();

        this.toast(
            report.passed+
            " از "+
            report.total+
            " بررسی اولیه موفق"
        );

        console.log(
            "ALMAS CHECK:",
            report
        );

        return report;

    }

};

function startAlmasSimulator(){

    AlmasFinalManager.start();

}

function stopAlmasSimulator(){

}
