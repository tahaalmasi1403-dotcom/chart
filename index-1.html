
<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>دستیار ترید | چارت زنده</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
/* ===================== تم تیره (پیش‌فرض) ===================== */
:root{
  --bg:#000;--panel:#0a0c10;--panel2:#10131a;--grid:#1a1e28;--txt:#e6e8ee;--mut:#7d8496;
  --up:#22d3a0;--dn:#ff5470;--acc:#3d7bff;--gold:#ffd24a;
  --chip:#1b2236;--chipb:#2a3350;--bar:#161a24;--ovl:#000b;--glass:#000c;--input:#000;
  --upbg:#04251d;--upbd:#157a5c;--dnbg:#2d0a12;--dnbd:#9c2740;--wnbg:#2b2204;--wnbd:#8a6d12;
  --adv:#0d1020;--advb:#1d2442;--upglow:#22d3a055;--dnglow:#ff547055;
  --zup:rgba(34,211,160,.17);--zdn:rgba(255,84,112,.17);--pillen:#10131aee;--shadow:0 4px 14px #0008;
  color-scheme:dark;
}
/* ===================== تم روشن ===================== */
html[data-theme="light"]{
  --bg:#fff;--panel:#f5f7fb;--panel2:#eaeef5;--grid:#dde2ec;--txt:#0f1420;--mut:#69718a;
  --up:#0c9f76;--dn:#e0294a;--acc:#2f6bff;--gold:#b07d00;
  --chip:#e3e9f6;--chipb:#cdd6ea;--bar:#e3e7ef;--ovl:#0a0f1c88;--glass:#fffd;--input:#fff;
  --upbg:#e1f6ee;--upbd:#7fd1b3;--dnbg:#fde7ec;--dnbd:#eca3b1;--wnbg:#fff3d1;--wnbd:#e0bd5a;
  --adv:#eef2fc;--advb:#cfd8f0;--upglow:#0c9f7655;--dnglow:#e0294a55;
  --zup:rgba(12,159,118,.15);--zdn:rgba(224,41,74,.14);--pillen:#ffffffee;--shadow:0 4px 14px #1b25402e;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden;overscroll-behavior:none;transition:background .25s,color .25s}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;gap:10px;padding:8px 12px 4px;direction:ltr}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--grid);border-radius:10px;padding:7px 11px;cursor:pointer}
button:active{opacity:.65}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#symBtn{font-weight:700;font-size:15px;letter-spacing:.3px}
#price{font-size:22px;font-weight:700;direction:ltr;font-variant-numeric:tabular-nums;transition:color .15s}
#chg{font-size:13px;direction:ltr}
.g{color:var(--up)}.r{color:var(--dn)}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:10px}
#live{width:8px;height:8px;border-radius:50%;background:#888}
#live.ok{background:var(--up);box-shadow:0 0 8px var(--up)}
.ib{width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:12px}

/* ---------- کارت موجودی ---------- */
#wallet{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 12px 6px;padding:8px 12px;border-radius:14px;border:1px solid var(--grid);background:var(--panel);cursor:pointer;transition:background .3s,border-color .3s;direction:rtl}
#wallet.up{background:var(--upbg);border-color:var(--upbd)}
#wallet.dn{background:var(--dnbg);border-color:var(--dnbd)}
@keyframes tkUp{0%{box-shadow:0 0 0 0 var(--upglow)}100%{box-shadow:0 0 0 12px transparent}}
@keyframes tkDn{0%{box-shadow:0 0 0 0 var(--dnglow)}100%{box-shadow:0 0 0 12px transparent}}
#wallet.tkUp{animation:tkUp .6s ease-out}
#wallet.tkDn{animation:tkDn .6s ease-out}
.wl{display:flex;align-items:center;gap:9px;min-width:0}
.wic{width:34px;height:34px;border-radius:11px;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--mut);flex:0 0 auto}
#wallet.up .wic{background:var(--up);color:#fff}
#wallet.dn .wic{background:var(--dn);color:#fff}
.wt{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.wt small{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt .wcap{font-size:12px;color:var(--mut)}
.wr{display:flex;flex-direction:column;align-items:flex-end;line-height:1.3}
.wr b{font-size:20px;font-weight:800;transition:color .3s}
.wr .wd{font-size:12px;font-weight:600;color:var(--mut);transition:color .3s}
#wallet.up .wr b,#wallet.up .wr .wd{color:var(--up)}
#wallet.dn .wr b,#wallet.dn .wr .wd{color:var(--dn)}

#tfs{display:flex;gap:6px;padding:2px 12px 6px;direction:ltr;overflow-x:auto;scrollbar-width:none}
#tfs button{padding:4px 11px;font-size:12.5px;flex:0 0 auto;border-radius:8px;background:transparent;border-color:transparent;color:var(--mut)}
#tfs button.on{background:var(--chip);color:var(--txt);border-color:var(--chipb)}
#chips{display:none;gap:6px;padding:0 12px 6px;overflow-x:auto;scrollbar-width:none;direction:ltr}
#chips button{flex:0 0 auto;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--panel);color:var(--txt)}
#chips button.on{border-color:var(--gold);color:var(--gold);background:var(--panel2)}
#legend{font-size:11px;color:var(--mut);padding:0 12px 3px;min-height:15px;direction:ltr;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
#wrap{flex:1;display:flex;flex-direction:column;position:relative;min-height:0;direction:ltr}
#cwrap{flex:1;min-height:0;position:relative}
#chart{position:absolute;inset:0}
#rsi{height:100px;display:none;border-top:1px solid var(--grid)}
#measure{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--glass);border:1px solid var(--grid);border-radius:10px;padding:6px 10px;font-size:12px;display:none;z-index:5;direction:rtl}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--glass);z-index:4;font-size:14px}
#evt{position:absolute;top:8px;left:8px;right:8px;z-index:6;display:none;padding:10px 12px;border-radius:12px;font-size:13px;direction:rtl;line-height:1.7;border:1px solid;backdrop-filter:blur(6px)}
#evt b{display:block;font-size:14px}
#evt.win{background:var(--upbg);border-color:var(--upbd)}
#evt.warn{background:var(--wnbg);border-color:var(--wnbd)}
#evt.bad{background:var(--dnbg);border-color:var(--dnbd)}

/* ---------- باکس پوزیشن روی چارت (Long / Short) ---------- */
#ov{position:absolute;left:0;top:0;right:56px;bottom:26px;overflow:hidden;pointer-events:none;z-index:3;direction:ltr}
.pbox{position:absolute;left:0;top:0;width:0;height:0;display:none}
.pbox .z{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
.pbox .zp{background:linear-gradient(var(--zup),var(--zup));border-radius:4px}
.pbox .zl{background:linear-gradient(var(--zdn),var(--zdn));border-radius:4px}
.pbox .ln{position:absolute;left:0;top:0;height:0;width:0;will-change:transform}
.pbox .lp{border-top:2px solid var(--up)}
.pbox .ls{border-top:2px solid var(--dn)}
.pbox .le{border-top:2px dashed var(--gold)}
.pbox.hit-tp .zp{background:linear-gradient(var(--zup),var(--zup)),linear-gradient(var(--zup),var(--zup))}
.pbox.hit-sl .zl{background:linear-gradient(var(--zdn),var(--zdn)),linear-gradient(var(--zdn),var(--zdn))}
.pill{position:absolute;left:0;top:0;pointer-events:auto;touch-action:none;display:flex;align-items:center;gap:7px;padding:6px 11px 6px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;color:#fff;box-shadow:var(--shadow);cursor:ns-resize;direction:ltr;user-select:none;-webkit-user-select:none;will-change:transform}
.pill.tp{background:var(--up)}
.pill.sl{background:var(--dn)}
.pill.en{background:var(--pillen);color:var(--txt);border:1.5px solid var(--gold);cursor:move;backdrop-filter:blur(4px)}
.pill.drag{transform-origin:center;filter:brightness(1.1);box-shadow:0 6px 20px #0006}
.pill .gr{width:12px;height:14px;flex:0 0 auto;background:radial-gradient(circle,currentColor 1.3px,transparent 1.6px) 0 0/6px 5px;opacity:.75}
.pill .pg{color:var(--up)}.pill .pr{color:var(--dn)}
.chip{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;padding:4px 4px 4px 10px;border-radius:12px;font-size:11px;font-weight:700;background:var(--pillen);border:1px solid var(--grid);box-shadow:var(--shadow);backdrop-filter:blur(4px);white-space:nowrap;direction:ltr;will-change:transform}
.chip .cs{padding:2px 8px;border-radius:8px;color:#fff;letter-spacing:.3px}
.chip.long .cs{background:var(--up)}.chip.short .cs{background:var(--dn)}
.chip .cl,.chip .cr{color:var(--mut);font-weight:600}
.chip .ch{font-weight:700}
.chip .cx{width:24px;height:24px;padding:0;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--panel2);font-size:12px;line-height:1}

/* ---------- پنل پوزیشن ربات ---------- */
#pp{display:none;background:var(--panel);border-top:1px solid var(--grid);max-height:48vh;overflow-y:auto;direction:rtl;-webkit-overflow-scrolling:touch}
#ppHead{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:12.5px;white-space:nowrap;overflow:hidden;position:sticky;top:0;background:var(--panel);z-index:2}
#ppHead .sp{flex:1}
#ppHead i{font-style:normal;color:var(--mut);transition:transform .2s}
#pp.open #ppHead i{transform:rotate(180deg)}
#ppBody{display:none;padding:2px 12px 12px;font-size:13px}
#pp.open #ppBody{display:block}
.kv{display:flex;justify-content:space-between;gap:8px;padding:4px 0;color:var(--mut)}
.kv b{color:var(--txt)}
.bl{display:flex;justify-content:space-between;margin:8px 0 4px;font-size:12px;color:var(--mut)}
.bar{position:relative;height:7px;background:var(--bar);border-radius:5px;overflow:hidden;direction:ltr}
.bar i{display:block;height:100%;width:0;border-radius:5px;transition:width .25s}
.bar .gb{background:linear-gradient(90deg,#128f6e,var(--up))}
.bar .rb{background:linear-gradient(90deg,#a8334a,var(--dn))}
.bar s{position:absolute;top:0;bottom:0;width:1px;background:var(--bg);opacity:.7}
.lv{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--grid);font-size:12.5px}
.lv em{font-style:normal;color:var(--mut);min-width:64px;text-align:left}
.lv.done{opacity:.5}
.lv.done em{color:var(--up)}
.next{margin:10px 0 6px;padding:9px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--grid);line-height:1.75}
.next.hot{background:var(--upbg);border-color:var(--upbd)}
.adv{margin:8px 0;padding:9px 10px;border-radius:10px;background:var(--adv);border:1px solid var(--advb);line-height:1.85;font-size:12.5px}
.adv h4{margin:0 0 4px;font-size:13px}
.adv div+div{margin-top:3px}
.acts{display:flex;gap:6px;margin-top:8px}
.acts button{flex:1;font-size:12.5px;padding:9px 4px}
.acts .go{background:var(--upbg);border-color:var(--upbd)}
.acts .danger{background:var(--dnbg);border-color:var(--dnbd)}
.acts button:disabled{opacity:.35}
.hint{font-size:11px;color:var(--mut);margin-top:8px;line-height:1.7}

/* ---------- نوار راهنما + نوار ابزار ---------- */
#alertbar{display:none;align-items:center;gap:8px;padding:8px 10px;background:var(--chip);font-size:13px}
#alertbar span{flex:1}
#hint{display:none;align-items:center;gap:8px;padding:8px 12px;background:var(--chip);border-top:1px solid var(--chipb);font-size:13px;font-weight:600}
#hint span{flex:1;line-height:1.6}
#hint button{padding:5px 10px;font-size:12px;border-radius:9px}
#tools{display:flex;align-items:stretch;gap:8px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--grid);direction:rtl}
#tprim{display:flex;gap:7px;flex:0 0 auto}
.ptool{width:78px;height:56px;padding:0;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:800;font-size:12px;border:1.5px solid;transition:transform .12s,box-shadow .2s}
.ptool svg.i{width:23px;height:23px;stroke-width:2.2}
.ptool small{font-size:9.5px;font-weight:600;opacity:.8;margin-top:-2px}
.ptool.long{color:var(--up);background:var(--upbg);border-color:var(--upbd)}
.ptool.short{color:var(--dn);background:var(--dnbg);border-color:var(--dnbd)}
.ptool.long.on{background:var(--up);color:#fff;border-color:var(--up);box-shadow:0 4px 16px var(--upglow)}
.ptool.short.on{background:var(--dn);color:#fff;border-color:var(--dn);box-shadow:0 4px 16px var(--dnglow)}
.ptool:active{transform:scale(.94)}
#tscroll{display:flex;align-items:stretch;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding-right:8px;border-right:1px solid var(--grid)}
#tscroll::-webkit-scrollbar{display:none}
.tb{flex:0 0 auto;min-width:58px;height:56px;padding:0 6px;border-radius:13px;background:transparent;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;color:var(--mut);transition:transform .12s}
.tb svg.i{width:21px;height:21px}
.tb.on{background:var(--chip);border-color:var(--chipb);color:var(--txt)}
.tb:active{transform:scale(.93)}
.tb.dang{color:var(--dn)}
.sep{flex:0 0 1px;background:var(--grid);margin:8px 3px}

#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--glass);border:1px solid var(--grid);color:var(--txt);padding:8px 14px;border-radius:12px;font-size:13px;display:none;z-index:50;max-width:90%;text-align:center;backdrop-filter:blur(6px)}
.sheet{position:fixed;inset:0;background:var(--ovl);display:none;align-items:flex-end;z-index:40}
.sheet.open{display:flex}
.card{background:var(--panel);width:100%;border-radius:20px 20px 0 0;padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px));max-height:80%;overflow:auto;border-top:1px solid var(--grid)}
.card::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--chipb);margin:0 auto 10px}
.card h3{margin:0 0 10px;font-size:15px}
.card p{line-height:1.9;font-size:13px;margin:6px 0}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;direction:ltr}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--grid)}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--chipb);position:relative;transition:background .2s;border:0;padding:0;flex:0 0 auto;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px #0004}
.sw:checked{background:var(--acc)}
.sw:checked::after{left:21px}
input[type=text]{width:100%;background:var(--input);color:var(--txt);border:1px solid var(--grid);border-radius:10px;padding:10px;font-size:16px;margin-top:8px;direction:ltr}
.fl{display:block;margin-top:12px;font-size:12.5px;color:var(--mut)}
.qrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;direction:ltr}
.qrow button{flex:1 1 auto;min-width:46px;padding:7px 4px;font-size:12.5px;border-radius:9px}
.note{font-size:12px;color:var(--mut);line-height:1.8;background:var(--panel2);border:1px solid var(--grid);border-radius:10px;padding:8px 10px;margin:4px 0 2px}
.two{display:flex;gap:8px;margin-top:14px}.two button{flex:1;padding:12px}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="symBtn"><span id="symTxt">BTC/USDT</span> ▾</button>
    <div id="price">—</div>
    <div id="chg"></div>
    <div class="hd-r">
      <span id="live" title="اتصال زنده"></span>
      <button id="thBtn" class="ib" aria-label="تغییر پس‌زمینه (سفید / مشکی)" title="سفید / مشکی"></button>
    </div>
  </header>

  <div id="wallet" class="flat" role="button" aria-label="سرمایه و موجودی">
    <div class="wl">
      <span class="wic"><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h13v4"/><path d="M3 7v11a2 2 0 002 2h14a1 1 0 001-1v-3"/><path d="M21 9H17a2 2 0 000 4h4z"/></svg></span>
      <div class="wt"><small id="wSrc">سرمایه شما</small><span class="num wcap" id="wCap">—</span></div>
    </div>
    <div class="wr"><b class="num" id="wEq">—</b><span class="num wd" id="wDelta"></span></div>
  </div>

  <div id="tfs"></div>
  <div id="chips"></div>
  <div id="legend"></div>
  <div id="wrap">
    <div id="cwrap">
      <div id="chart"></div>
      <div id="ov"></div>
      <div id="measure"></div>
      <div id="evt"></div>
      <div id="load">⏳ در حال دریافت کندل‌ها...</div>
    </div>
    <div id="rsi"></div>
  </div>
  <div id="pp">
    <div id="ppHead"></div>
    <div id="ppBody"></div>
  </div>
  <div id="alertbar"><span id="alertTxt"></span><button id="alOk">✅ ثبت</button><button id="alNo">لغو</button></div>
  <div id="hint"><span id="hintTxt"></span><button id="hintX">✕ لغو</button></div>

  <nav id="tools">
    <div id="tprim">
      <button class="ptool long" data-tool="long">
        <svg class="i" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
        Long<small>خرید</small>
      </button>
      <button class="ptool short" data-tool="short">
        <svg class="i" viewBox="0 0 24 24"><path d="M3 7l6 6 4-4 8 8"/><path d="M15 17h6v-6"/></svg>
        Short<small>فروش</small>
      </button>
    </div>
    <div id="tscroll">
      <button class="tb on" data-tool="none"><svg class="i" viewBox="0 0 24 24"><path d="M5 3l14 7-6 2-2 6z"/></svg>مکان‌نما</button>
      <button class="tb" data-tool="h"><svg class="i" viewBox="0 0 24 24"><path d="M3 12h18"/><circle cx="12" cy="12" r="2.2"/></svg>خط افقی</button>
      <button class="tb" data-tool="t"><svg class="i" viewBox="0 0 24 24"><path d="M4 19L20 5"/><circle cx="4" cy="19" r="1.8"/><circle cx="20" cy="5" r="1.8"/></svg>خط روند</button>
      <button class="tb" data-tool="m"><svg class="i" viewBox="0 0 24 24"><path d="M3 16L16 3l5 5L8 21z"/><path d="M7 12l2 2M10 9l2 2M13 6l2 2"/></svg>اندازه</button>
      <button class="tb" data-tool="al"><svg class="i" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0112 0v5l2 2H4z"/><path d="M10 21h4"/></svg>هشدار</button>
      <span class="sep"></span>
      <button class="tb" id="bPos"><svg class="i" viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>پوزیشن ربات</button>
      <button class="tb" id="bInd"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>اندیکاتور</button>
      <span class="sep"></span>
      <button class="tb" id="bUndo"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>برگشت</button>
      <button class="tb dang" id="bClear"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>پاک‌کردن</button>
      <button class="tb" id="bLast"><svg class="i" viewBox="0 0 24 24"><path d="M5 5l7 7-7 7M13 5l7 7-7 7"/></svg>آخرین</button>
    </div>
  </nav>
</div>
<div id="toast"></div>

<div class="sheet" id="symSheet"><div class="card">
  <h3>انتخاب ارز</h3>
  <div class="grid" id="coinGrid"></div>

<script>
(() => {
'use strict';
const tg = window.Telegram && window.Telegram.WebApp;
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

// =====================================================================
//                         تم روشن / تیره
// =====================================================================
const THEMES = {
  dark: {bg:'#000000', panel:'#0a0c10', text:'#8a90a2', grid:'#0b0d12', gridH:'#10131a', border:'#141824', cross:'#3a4156', crossLbl:'#1b2236',
    up:'#22d3a0', dn:'#ff5470', volUp:'#22d3a033', volDn:'#ff547033', wm:'#ffffff0d', gold:'#ffd24a',
    tp:'#00e676', tp12:'#69f0ae', tpDone:'#3b6b5c', sl:'#ff1744', liq:'#b71c1c',
    e20:'#ffb74d', e50:'#5aa9ff', bb:'#9575cd', bbm:'#9575cd55', rsi:'#b39ddb', trend:'#ffca28', measure:'#ffffff', alert:'#42a5f5', tmp:'#ffffff'},
  light: {bg:'#ffffff', panel:'#f5f7fb', text:'#5b6378', grid:'#f2f4f9', gridH:'#e9edf4', border:'#dde2ec', cross:'#9aa3b8', crossLbl:'#2b3245',
    up:'#0c9f76', dn:'#e0294a', volUp:'#0c9f7638', volDn:'#e0294a38', wm:'#0000000c', gold:'#b07d00',
    tp:'#079669', tp12:'#12b27f', tpDone:'#9cc9ba', sl:'#d11a3b', liq:'#8e1a1a',
    e20:'#f08c00', e50:'#2f6bff', bb:'#7e57c2', bbm:'#7e57c255', rsi:'#7e57c2', trend:'#c58a00', measure:'#222222', alert:'#1e88e5', tmp:'#222222'},
};
let theme = store.get('theme', 'dark'); if (!THEMES[theme]) theme = 'dark';
let T = THEMES[theme];
document.documentElement.dataset.theme = theme;

if (tg) {
  try { tg.ready(); tg.expand(); tg.setHeaderColor(T.bg); tg.setBackgroundColor(T.bg); } catch (e) {}
  try { tg.setBottomBarColor && tg.setBottomBarColor(T.panel); } catch (e) {}
  try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}   // کشیدن چارت، مینی‌اپ رو نبنده
}

const BASES = ['https://data-api.binance.vision', 'https://api.binance.com', 'https://api1.binance.com'];
const WSS = ['wss://stream.binance.com:9443/stream?streams=', 'wss://data-stream.binance.vision/stream?streams='];
const COINS = ['BTC','ETH','BNB','SOL','XRP','DOGE','ADA','TON','AVAX','LINK','DOT','TRX','LTC','SHIB','PEPE','NEAR','APT','ARB','OP','SUI'];
const TFS = ['1m','5m','15m','1h','4h','1d'];
const TF_SEC = {'1m':60,'5m':300,'15m':900,'1h':3600,'4h':14400,'1d':86400};
const STEP = 33.5;                       // هر مرحله سیو سود (٪ مسیر تارگت و ٪ دارایی)
const OFF = -new Date().getTimezoneOffset() * 60;   // نمایش ساعت محلی

// ---------- پوزیشن‌های ربات (از آدرس)
const Q = new URLSearchParams(location.search);
const clean = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/USDT$/, '');
const nn = v => (v === null || v === undefined || v === '') ? null : (isFinite(+v) ? +v : null);
let POS = [], pi = 0;
try {
  const raw = Q.get('pos');
  if (raw) {
    let s = raw.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
    POS = JSON.parse(atob(s)).map(x => ({
      id: x.i, coin: clean(x.c), side: x.s === 'S' ? 'short' : 'long', entry: +x.e, target: +x.t,
      stop: nn(x.sl), orig: nn(x.os) != null ? nn(x.os) : nn(x.sl), left: nn(x.l) == null ? 1 : +x.l,
      saved: x.ts || 0, real: +x.r || 0, qty: +x.q, cap: +x.cap, lev: +x.lev || 1
    })).filter(x => x.coin && x.entry > 0 && x.target > 0);
  }
} catch (e) { POS = []; }
  if (!POS.length && nn(Q.get('entry')) && nn(Q.get('target'))) {        // سازگاری با لینک قدیمی (فقط نمایش)
  const e = +Q.get('entry'), cap = nn(Q.get('cap')) || 100, lev = nn(Q.get('lev')) || 1;
  POS = [{id: null, coin: clean(Q.get('coin') || 'BTC'), side: Q.get('side') === 'short' ? 'short' : 'long', entry: e,
          target: +Q.get('target'), stop: nn(Q.get('stop')), orig: nn(Q.get('stop')), left: 1, saved: 0, real: 0,
          qty: cap * lev / e, cap, lev}];
}

let sym = clean(Q.get('coin')) || (POS[0] && POS[0].coin) || clean(store.get('sym', 'BTC')) || 'BTC';
let tf = Q.get('tf') || store.get('tf', '15m');
if (!TFS.includes(tf)) tf = '15m';
const ind = Object.assign({ema20: true, ema50: true, bb: false, vol: true, rsi: false}, store.get('ind', {}));
let data = [], prec = 2;

// ---------- helpers
const f = p => p == null ? '—' : p.toLocaleString('en-US', {minimumFractionDigits: prec, maximumFractionDigits: prec});
const fq = x => String(+x.toPrecision(6));
const sgn = x => (x >= 0 ? '+' : '') + x.toFixed(2);
const usd = x => (x >= 0 ? '+' : '−') + '$' + Math.abs(x).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const usd0 = x => '$' + x.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const rp = v => +v.toFixed(Math.max(prec, 2));
function toast(msg, ms = 2800) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', ms);
}
function haptic(kind) { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(kind); } catch (e) {} }
function tick() { try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) {} }
async function api(path) {
  let err;
  for (const b of BASES) {
    try { const r = await fetch(b + path); if (!r.ok) throw new Error(r.status); return await r.json(); }
    catch (e) { err = e; }
  }
  throw err;
}
function setPrec(p) {
  prec = p >= 1000 ? 2 : p >= 1 ? 3 : p >= 0.1 ? 4 : p >= 0.01 ? 5 : 7;
  candle.applyOptions({priceFormat: {type: 'price', precision: prec, minMove: Math.pow(10, -prec)}});
}

// ---------- charts
const base = {
  autoSize: true,
  layout: {background: {type: 'solid', color: T.bg}, textColor: T.text, fontSize: 11, fontFamily: 'system-ui,-apple-system,Segoe UI,Tahoma,sans-serif'},
  grid: {vertLines: {color: T.grid}, horzLines: {color: T.gridH}},
  crosshair: {mode: LightweightCharts.CrosshairMode.Normal,
    vertLine: {color: T.cross, labelBackgroundColor: T.crossLbl}, horzLine: {color: T.cross, labelBackgroundColor: T.crossLbl}},
  rightPriceScale: {borderColor: T.border, scaleMargins: {top: 0.08, bottom: 0.2}},
};
const chart = LightweightCharts.createChart($('chart'), Object.assign({}, base, {
  timeScale: {borderColor: T.border, timeVisible: true, secondsVisible: false, rightOffset: 6, barSpacing: 8},
  kineticScroll: {touch: true, mouse: false},
  watermark: {visible: true, text: '', color: T.wm, fontSize: 44, horzAlign: 'center', vertAlign: 'center'},
}));
const ts = chart.timeScale();
const candle = chart.addCandlestickSeries({upColor: T.up, downColor: T.dn, borderVisible: false, wickUpColor: T.up, wickDownColor: T.dn});
const vol = chart.addHistogramSeries({priceFormat: {type: 'volume'}, priceScaleId: 'vol', lastValueVisible: false, priceLineVisible: false});
chart.priceScale('vol').applyOptions({scaleMargins: {top: 0.86, bottom: 0}});
const lineOpt = (color, w = 2) => ({color, lineWidth: w, lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false});
const e20 = chart.addLineSeries(lineOpt(T.e20, 1.5));
const e50 = chart.addLineSeries(lineOpt(T.e50, 1.5));
const bbU = chart.addLineSeries(lineOpt(T.bb, 1));
const bbM = chart.addLineSeries(lineOpt(T.bbm, 1));
const bbL = chart.addLineSeries(lineOpt(T.bb, 1));

const rchart = LightweightCharts.createChart($('rsi'), Object.assign({}, base, {
  rightPriceScale: {borderColor: T.border, scaleMargins: {top: 0.1, bottom: 0.1}},
  timeScale: {visible: false}, handleScroll: false, handleScale: false,
}));
const rs = rchart.addLineSeries({color: T.rsi, lineWidth: 2, priceLineVisible: false});
const rsHi = rs.createPriceLine({price: 70, color: T.dn + '88', lineWidth: 1, lineStyle: 2, axisLabelVisible: false});
const rsLo = rs.createPriceLine({price: 30, color: T.up + '88', lineWidth: 1, lineStyle: 2, axisLabelVisible: false});
chart.timeScale().subscribeVisibleLogicalRangeChange(r => { if (r && ind.rsi) rchart.timeScale().setVisibleLogicalRange(r); });

const volColor = c => c.close >= c.open ? T.volUp : T.volDn;
function applyTheme(name, persist = true) {
  theme = name; T = THEMES[name];
  document.documentElement.dataset.theme = name;
  if (persist) store.set('theme', name);
  const mt = document.querySelector('meta[name=theme-color]'); if (mt) mt.content = T.bg;
  const lay = {
    layout: {background: {type: 'solid', color: T.bg}, textColor: T.text},
    grid: {vertLines: {color: T.grid}, horzLines: {color: T.gridH}},
    crosshair: {vertLine: {color: T.cross, labelBackgroundColor: T.crossLbl}, horzLine: {color: T.cross, labelBackgroundColor: T.crossLbl}},
    rightPriceScale: {borderColor: T.border},
  };
  chart.applyOptions(Object.assign({}, lay, {timeScale: {borderColor: T.border}, watermark: {color: T.wm}}));
  rchart.applyOptions(lay);
  candle.applyOptions({upColor: T.up, downColor: T.dn, wickUpColor: T.up, wickDownColor: T.dn});
  e20.applyOptions({color: T.e20}); e50.applyOptions({color: T.e50});
  bbU.applyOptions({color: T.bb}); bbM.applyOptions({color: T.bbm}); bbL.applyOptions({color: T.bb});
  rs.applyOptions({color: T.rsi}); rsHi.applyOptions({color: T.dn + '88'}); rsLo.applyOptions({color: T.up + '88'});
  if (data.length) {
    vol.setData(data.map(d => ({time: d.time, value: d.vol, color: volColor(d)})));
    drawBot();
    const items = objs.map(o => o.it); wipeObjs(); items.forEach(it => addItem(it, false));
  }
  const sun = '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const moon = '<svg class="i" viewBox="0 0 24 24"><path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/></svg>';
  $('thBtn').innerHTML = name === 'dark' ? sun : moon;      // آیکون = حالتی که با کلیک میره
  $('themeChk').checked = name === 'light';
  if (tg) {
    try { tg.setHeaderColor(T.bg); tg.setBackgroundColor(T.bg); } catch (e) {}
    try { tg.setBottomBarColor && tg.setBottomBarColor(T.panel); } catch (e) {}
  }
  renderWallet();
}
$('thBtn').onclick = () => applyTheme(theme === 'dark' ? 'light' : 'dark');
$('themeChk').onchange = e => applyTheme(e.target.checked ? 'light' : 'dark');

// ---------- اندیکاتورها (کامل برای setData، افزایشی برای هر تیک → سریع)
let a20 = [], a50 = [], rG = [], rL = [];
const emaVals = (d, n) => { const k = 2 / (n + 1), o = new Array(d.length); let e = d[0].close;
  for (let i = 0; i < d.length; i++) { e = i ? d[i].close * k + e * (1 - k) : d[i].close; o[i] = e; } return o; };
function bbAt(i, n = 20, m = 2) {
  let s = 0; for (let j = i - n + 1; j <= i; j++) s += data[j].close;
  const mean = s / n; let v = 0; for (let j = i - n + 1; j <= i; j++) v += (data[j].close - mean) ** 2;
  const sd = Math.sqrt(v / n); return {u: mean + m * sd, m: mean, l: mean - m * sd};
}
function rsiFull() {
  const n = 14, out = []; rG = []; rL = [];
  if (data.length <= n) return out;
  let g = 0, l = 0;
  for (let i = 1; i <= n; i++) { const x = data[i].close - data[i - 1].close; if (x >= 0) g += x; else l -= x; }
  g /= n; l /= n; rG[n] = g; rL[n] = l;
  out.push({time: data[n].time, value: l === 0 ? 100 : 100 - 100 / (1 + g / l)});
  for (let i = n + 1; i < data.length; i++) {
    const x = data[i].close - data[i - 1].close;
    g = (g * (n - 1) + Math.max(x, 0)) / n; l = (l * (n - 1) + Math.max(-x, 0)) / n; rG[i] = g; rL[i] = l;
    out.push({time: data[i].time, value: l === 0 ? 100 : 100 - 100 / (1 + g / l)});
  }
  return out;
}
function fullInd() {
  if (!data.length) return;
  a20 = emaVals(data, 20); a50 = emaVals(data, 50);
  e20.setData(data.map((c, i) => ({time: c.time, value: a20[i]})));
  e50.setData(data.map((c, i) => ({time: c.time, value: a50[i]})));
  const U = [], M = [], L = [];
  for (let i = 19; i < data.length; i++) { const b = bbAt(i); U.push({time: data[i].time, value: b.u}); M.push({time: data[i].time, value: b.m}); L.push({time: data[i].time, value: b.l}); }
  bbU.setData(U); bbM.setData(M); bbL.setData(L);
  if (ind.rsi) rs.setData(rsiFull());
}
function tailInd() {
  const n = data.length, i = n - 1; if (!n) return; const c = data[i];
  const ema = (arr, k) => { arr[i] = i ? c.close * k + arr[i - 1] * (1 - k) : c.close; arr.length = n; return arr[i]; };
  e20.update({time: c.time, value: ema(a20, 2 / 21)});
  e50.update({time: c.time, value: ema(a50, 2 / 51)});
  if (n >= 20) { const b = bbAt(i); bbU.update({time: c.time, value: b.u}); bbM.update({time: c.time, value: b.m}); bbL.update({time: c.time, value: b.l}); }
  if (ind.rsi && n > 14 && rG[i - 1] != null) {
    const x = c.close - data[i - 1].close;
    const g = (rG[i - 1] * 13 + Math.max(x, 0)) / 14, l = (rL[i - 1] * 13 + Math.max(-x, 0)) / 14;
    rG[i] = g; rL[i] = l; rs.update({time: c.time, value: l === 0 ? 100 : 100 - 100 / (1 + g / l)});
  }
}
function applyVis() {
  e20.applyOptions({visible: ind.ema20}); e50.applyOptions({visible: ind.ema50});
  [bbU, bbM, bbL].forEach(s => s.applyOptions({visible: ind.bb}));
  vol.applyOptions({visible: ind.vol});
  $('rsi').style.display = ind.rsi ? 'block' : 'none';
  document.querySelectorAll('[data-ind]').forEach(c => c.checked = !!ind[c.dataset.ind]);
}

// ---------- دیتا + زنده
async function load() {
  stopLive(); wipeObjs(); clearTmp(); clearMeasure();
  chart.applyOptions({watermark: {text: sym + ' · ' + tf}});
  $('load').style.display = 'flex';
  const k0 = POS.findIndex(p => p.coin === sym); if (k0 >= 0) pi = k0;
  try {
    const k = await api(`/api/v3/klines?symbol=${sym}USDT&interval=${tf}&limit=720`);
    data = k.map(x => ({time: Math.floor(x[0] / 1000) + OFF, open: +x[1], high: +x[2], low: +x[3], close: +x[4], vol: +x[5]}));
    setPrec(data[data.length - 1].close);
    candle.setData(data.map(({time, open, high, low, close}) => ({time, open, high, low, close})));
    vol.setData(data.map(d => ({time: d.time, value: d.vol, color: volColor(d)})));
    fullInd(); applyVis(); restore(); drawBot();
    chart.timeScale().setVisibleLogicalRange({from: Math.max(0, data.length - 90), to: data.length + 6});
    onPrice(data[data.length - 1].close, true);
    buildChips(); buildPanel();
    startLive(); loadTicker();
  } catch (e) {
    toast('❌ دریافت کندل‌ها ممکن نشد؛ فیلترشکن رو چک کن');
                                }
    $('load').style.display = 'none';
}
async function loadTicker() {
  try {
    const t = await api(`/api/v3/ticker/24hr?symbol=${sym}USDT`);
    const c = +t.priceChangePercent; const el = $('chg');
    el.textContent = sgn(c) + '%'; el.className = c >= 0 ? 'g' : 'r';
  } catch (e) {}
}
let lastShown = null;
function header(p) {
  $('symTxt').textContent = sym + '/USDT'; $('price').textContent = f(p);
  if (lastShown != null && p !== lastShown) $('price').style.color = p > lastShown ? T.up : T.dn;
  lastShown = p;
}
function onPrice(p, force) { header(p); updatePanel(p, force); refreshBoxes(); renderWallet(); }

function applyCandle(c, isTick) {
  const last = data[data.length - 1];
  if (last && c.time === last.time) data[data.length - 1] = c;
  else if (!last || c.time > last.time) data.push(c);
  else return;
  candle.update({time: c.time, open: c.open, high: c.high, low: c.low, close: c.close});
  if (!isTick) vol.update({time: c.time, value: c.vol, color: volColor(c)});
  tailInd(); onPrice(c.close);
}
// تیک‌های aggTrade با requestAnimationFrame جمع میشن تا موبایل روون بمونه
let tickP = null, tickT = 0, raf = 0;
function onTick(p, t) { tickP = p; tickT = t; if (!raf) raf = requestAnimationFrame(flush); }
function flush() {
  raf = 0; const p = tickP; tickP = null;
  const last = data[data.length - 1]; if (p == null || !last) return;
  if (tickT >= last.time + TF_SEC[tf]) return;       // کندل جدید از استریم kline میاد
  applyCandle({time: last.time, open: last.open, high: Math.max(last.high, p), low: Math.min(last.low, p), close: p, vol: last.vol}, true);
}

let ws = null, poll = null, wsTimer = null;
function stopLive() {
  clearTimeout(wsTimer); clearInterval(poll); poll = null;
  if (ws) { const w = ws; ws = null; try { w.close(); } catch (e) {} }
  $('live').className = '';
}
function startLive() { stopLive(); connectWS(0); }
function connectWS(i) {
  if (i >= WSS.length) { startPoll(); return; }
  let got = false; const s = sym.toLowerCase() + 'usdt';
  const w = new WebSocket(WSS[i] + `${s}@kline_${tf}/${s}@aggTrade`);
  ws = w;
  const to = setTimeout(() => { if (!got) { try { w.close(); } catch (e) {} } }, 7000);
  w.onmessage = e => {
    got = true; clearInterval(poll); poll = null; $('live').className = 'ok';
    let m; try { m = JSON.parse(e.data).data; } catch (x) { return; }
    if (!m) return;
    if (m.e === 'kline') { const k = m.k; applyCandle({time: Math.floor(k.t / 1000) + OFF, open: +k.o, high: +k.h, low: +k.l, close: +k.c, vol: +k.v}); }
    else if (m.e === 'aggTrade') onTick(+m.p, Math.floor(m.T / 1000) + OFF);
  };
  w.onerror = () => { try { w.close(); } catch (e) {} };
  w.onclose = () => {
    clearTimeout(to);
    if (ws !== w) return;
    if (!got) connectWS(i + 1);
    else { startPoll(); wsTimer = setTimeout(() => connectWS(0), 8000); }
  };
}
function startPoll() {
  if (poll) return;
  $('live').className = '';
  const once = async () => {
    try {
      const k = await api(`/api/v3/klines?symbol=${sym}USDT&interval=${tf}&limit=3`);
      k.forEach(x => applyCandle({time: Math.floor(x[0] / 1000) + OFF, open: +x[1], high: +x[2], low: +x[3], close: +x[4], vol: +x[5]}));
    } catch (e) {}
  };
  once(); poll = setInterval(once, 2000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && data.length) { startLive(); } });
setInterval(loadTicker, 30000);

// ---------- لجند کراس‌هر
chart.subscribeCrosshairMove(p => {
  const d = p.seriesData && p.seriesData.get(candle);
  if (!d) { $('legend').textContent = ''; return; }
  const ch = (d.close - d.open) / d.open * 100;

//                      اندیکاتور پوزیشن ربات
// =====================================================================
const dirOf = p => p.side === 'long' ? 1 : -1;
const levels = p => [p.entry + (p.target - p.entry) * STEP / 100, p.entry + (p.target - p.entry) * 2 * STEP / 100, p.target];
function progress(p, pr) {
  const d = dirOf(p), tdist = (p.target - p.entry) * d;
  const prog = tdist ? (pr - p.entry) * d / tdist * 100 : 0;
  let used = 0;
  if (p.orig) { const sd = (p.entry - p.orig) * d; if (sd > 0) used = Math.max(0, (p.entry - pr) * d / sd * 100); }
  return {prog, used};
}
const guarded = p => !!p.stop && p.stop === p.orig;
const liqOf = p => p.lev > 1 ? p.entry * (1 - dirOf(p) / p.lev) : null;
function stateKey(p, pr) {
  const d = dirOf(p), {prog, used} = progress(p, pr);
  if (p.stop && (pr - p.stop) * d <= 0) return 'stop';
  if (prog >= 100) return 'tp3';
  if (prog >= 2 * STEP && p.saved < 2) return 'tp2';
  if (prog >= STEP && p.saved < 1) return 'tp1';
  if (guarded(p)) { if (used >= 80) return 'sw80'; if (used >= 50) return 'sw50'; }
  const lq = liqOf(p);
  if (lq && (pr - (p.entry + 0.8 * (lq - p.entry))) * d <= 0) return 'liq';
  return null;
}

// --- تحلیل ۴ساعته (همون منطق ربات)
const techC = {};
async function getTech(coin) {
  const c = techC[coin]; if (c && Date.now() - c.ts < 120000) return c.t;
  const k = await api(`/api/v3/klines?symbol=${coin}USDT&interval=4h&limit=120`);
  const kl = k.map(x => [+x[2], +x[3], +x[4]]);
  const closes = kl.map(x => x[2]);
  const ema = (v, n) => { const kk = 2 / (n + 1); let e = v[0]; for (let i = 1; i < v.length; i++) e = v[i] * kk + e * (1 - kk); return e; };
  let g = 0, l = 0; for (let i = closes.length - 14; i < closes.length; i++) { const x = closes[i] - closes[i - 1]; g += Math.max(x, 0); l += Math.max(-x, 0); }
  const trs = []; for (let i = 1; i < kl.length; i++) trs.push(Math.max(kl[i][0] - kl[i][1], Math.abs(kl[i][0] - kl[i - 1][2]), Math.abs(kl[i][1] - kl[i - 1][2])));
  const highs = [], lows = [];
  for (let i = 3; i < kl.length - 3; i++) {
    const seg = kl.slice(i - 3, i + 4);
    if (kl[i][0] === Math.max(...seg.map(x => x[0]))) highs.push(kl[i][0]);
    if (kl[i][1] === Math.min(...seg.map(x => x[1]))) lows.push(kl[i][1]);
  }
  const t = {highs, lows, hi: Math.max(...kl.map(x => x[0])), lo: Math.min(...kl.map(x => x[1])),
    rsi: l === 0 ? 100 : 100 - 100 / (1 + g / l), ema20: ema(closes.slice(-60), 20), ema50: ema(closes, 50), atr: trs.slice(-14).reduce((a, b) => a + b, 0) / 14};
  techC[coin] = {t, ts: Date.now()}; return t;
}
function nearest(t, pr) {
  const res = t.highs.filter(h => h > pr * 1.002).sort((a, b) => a - b), sup = t.lows.filter(x => x < pr * 0.998).sort((a, b) => b - a);
  return {res: res[0] || t.hi, sup: sup[0] || t.lo};
}
// توصیه منطقی با توجه به مقاومت/حمایت، RSI و روند
function situation(p, t, pr, key) {
  const d = dirOf(p), L = [];
  if (!t) return ['تحلیل تکنیکال در دسترس نیست؛ طبق پلن عمل کن'];
  const {res, sup} = nearest(t, pr), r = t.rsi, av = t.atr;
  const withTrend = (t.ema20 > t.ema50) === (d === 1);
  const ahead = d === 1 ? res : sup, behind = d === 1 ? sup : res;
  const nA = d === 1 ? 'مقاومت' : 'حمایت', nB = d === 1 ? 'حمایت' : 'مقاومت';
  const nearA = Math.abs(ahead - pr) < 0.7 * av, nearB = Math.abs(pr - behind) < 0.7 * av;
  const extreme = d === 1 ? r > 70 : r < 30, exhausted = d === 1 ? r < 35 : r > 65;
  if (key === 'tp1' || key === 'tp2' || key === 'tp3') {
    if (nearA) L.push(`🧱 نزدیک ${nA} ${f(ahead)}؛ احتمال برگشت زیاده، سیو کردن منطقیه`);
    if (extreme) L.push(`🔥 RSI ${r.toFixed(0)} اشباعه؛ سیو سود رو حتماً انجام بده`);
    if (!withTrend) L.push('⚠️ خلاف روند ۴ساعته‌ای؛ می‌تونی سهم بیشتری (تا ۵۰٪) سیو کنی');
    if (!L.length) L.push('📈 روند همراهته و مانع نزدیکی نیست؛ فقط سهم برنامه رو سیو کن و بقیه رو با استاپ بالاتر نگه دار');
  } else if (key === 'sw50' || key === 'sw80') {
    if (nearB && exhausted) L.push(`🧊 نزدیک ${nB} ${f(behind)} و RSI ${r.toFixed(0)}؛ احتمال برگشت هست ولی حد ضرر رو دورتر نبر`);
    else if (nearB) L.push(`🛡 نزدیک ${nB} ${f(behind)}؛ اگه کندل ۴ساعته اون رو بشکنه، سریع‌تر خارج شو`);
    if (!withTrend) L.push('⚠️ روند ۴ساعته خلاف پوزیشنته؛ احتمال خوردن حد ضرر بیشتره');
    if (key === 'sw80') L.push('🚨 خیلی نزدیکه؛ یا الان ببند یا بذار استاپ کار خودش رو بکنه، جابجاش نکن');
    else if (!L.length) L.push('⏳ هنوز دلیل ورودت باطل نشده؛ حد ضرر رو دست نزن و صبر کن');
  } else if (key === 'stop') L.push('❌ از پلن خارج نشو؛ ببند و دنبال ستاپ بعدی باش');
  else if (key === 'liq') L.push('⚙️ بخشی از پوزیشن رو ببند یا مارجین اضافه کن');
  else {
    L.push(withTrend ? '✅ هم‌جهت با روند ۴ساعته' : '⚠️ خلاف روند ۴ساعته‌ای؛ احتیاط کن');
    L.push(`🧱 ${nA} جلوت: ${f(ahead)} (${sgn((ahead - pr) / pr * 100 * d)}%) • 🛡 ${nB} پشتت: ${f(behind)}`);
    L.push(extreme ? `🔥 RSI ${r.toFixed(0)} اشباعه؛ نزدیک سیو‌ها حواست باشه` : exhausted ? `🧊 RSI ${r.toFixed(0)}؛ فشار برگشتی کمه` : `😐 RSI ${r.toFixed(0)} خنثی`);
    if (p.stop && p.orig) { const risk = Math.abs(p.entry - p.orig); if (risk) L.push(`⚖️ ریسک به ریوارد 1 به ${(Math.abs(p.target - p.entry) / risk).toFixed(1)}`); }
    L.push('⏳ هنوز رویدادی نیست؛ طبق پلن صبر کن');
  }
  return L;
}

const CAPITAL = () => { const v = store.get('cap', null); return v != null && v > 0 ? v : (POS[0] ? POS[0].cap : 1000); };

function walletInfo() {
  const pr = last(), p = cur();
  if (p && pr != null) {
    const total = p.qty * p.left * (pr - p.entry) * dirOf(p) + p.real;
    return {cap: p.cap, pnl: total, src: `پوزیشن ربات · ${p.coin} ${p.side === 'long' ? 'Long' : 'Short'}${p.lev > 1 ? ' ' + p.lev + 'x' : ''}`};
  }
  const b = lastBox();
  if (b && pr != null) {
    const s = boxStats(b.it, pr), C = CAPITAL();
    return {cap: C, pnl: Math.max(-C, s.curMoney), src: `پوزیشن ترسیمی · ${s.d === 1 ? 'Long' : 'Short'} ${LEV()}x`};
                                                                                                                                                                   }
  return {cap: CAPITAL(), pnl: 0, src: 'سرمایه شما (پوزیشن بازی نیست)'};
}
let eqPrev = null;

// --- تبدیل زمان ⇄ مختصات لجیکال (مستقل از تایم‌فریم)
function logicalOf(t) {
  const n = data.length; if (!n) return 0;
  const st = TF_SEC[tf];
  if (t < data[0].time) return -(data[0].time - t) / st;
  let lo = 0, hi = n - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (data[m].time <= t) lo = m; else hi = m - 1; }
  return lo + (t - data[lo].time) / st;
}
function timeOfLogical(l) {
  const n = data.length; if (!n) return 0;
  return data[Math.max(0, Math.min(n - 1, Math.round(l)))].time;
}
const toLogical = x => { try { return ts.coordinateToLogical(x); } catch (e) { return null; } };
const fromLogical = l => { try { return ts.logicalToCoordinate(l); } catch (e) { return null; } };

// --- آمار یک باکس Long/Short: سود/ضرر پولی، RR و اینکه تارگت/استاپ خورده یا نه
function boxStats(it, pr) {
  const d = it.t > it.e ? 1 : -1, C = CAPITAL(), L = LEV();
  const pctOf = x => (x - it.e) / it.e * 100 * d;
  const tpPct = pctOf(it.t), slPct = pctOf(it.s);
  const mon = pct => C * L * pct / 100;
  const rr = Math.abs(it.t - it.e) / Math.max(Math.abs(it.e - it.s), 1e-12);
  let state = 'live';
  const n = data.length;
  if (n) {
    const i0 = Math.round(logicalOf(it.t0));
    for (let i = Math.max(0, i0 + 1); i < n; i++) {
      const c = data[i];
      const hitSl = d === 1 ? c.low <= it.s : c.high >= it.s;
      const hitTp = d === 1 ? c.high >= it.t : c.low <= it.t;
      if (hitSl) { state = 'sl'; break; }          // اگه توی یک کندل هر دو خورده باشن، محتاطانه استاپ حساب میشه
      if (hitTp) { state = 'tp'; break; }
    }
    if (state === 'live' && pr != null) {
      if ((pr - it.t) * d >= 0) state = 'tp'; else if ((pr - it.s) * d <= 0) state = 'sl';
    }
  }
  const livePct = pr != null ? pctOf(pr) : 0;
  const curPct = state === 'tp' ? tpPct : state === 'sl' ? slPct : livePct;
  return {d, tpPct, slPct, rr, state, livePct, tpMoney: mon(tpPct), slMoney: mon(slPct), liveMoney: mon(livePct), curMoney: mon(curPct), L};
}

// --- ساخت باکس Long/Short (روی لایه‌ی DOM، با دسته‌های قابل کشیدن)
function buildBox(it) {
  if (it.t0 == null) { const n = data.length; it.t0 = data[Math.max(0, n - 25)].time; }
  if (!it.dur) it.dur = 30 * TF_SEC[tf];
  const el = document.createElement('div'); el.className = 'pbox';
  el.innerHTML = `<div class="z zp"></div><div class="z zl"></div><div class="ln lp"></div><div class="ln le"></div><div class="ln ls"></div>
    <div class="chip"><b class="cs"></b><span class="cl"></span><span class="cr"></span><span class="ch"></span><button class="cx" aria-label="حذف">✕</button></div>
    <div class="pill en"><i class="gr"></i><span class="te"></span></div>
    <div class="pill tp"><i class="gr"></i><span class="tt"></span></div>
    <div class="pill sl"><i class="gr"></i><span class="tl"></span></div>`;
  ov.appendChild(el);
  const q = s => el.querySelector(s);
  const zp = q('.zp'), zl = q('.zl'), lp = q('.lp'), le = q('.le'), ls = q('.ls');
  const chip = q('.chip'), pe = q('.pill.en'), pt = q('.pill.tp'), ps = q('.pill.sl');
  const mk = (price, color) => candle.createPriceLine({price, color, lineWidth: 1, lineStyle: 2, lineVisible: false, axisLabelVisible: true, title: ''});
  const lE = mk(it.e, T.gold), lT = mk(it.t, T.tp), lS = mk(it.s, T.sl);

  function txt() {
    const s = boxStats(it, last());
    const long = s.d === 1;
    chip.className = 'chip ' + (long ? 'long' : 'short');
    q('.cs').textContent = long ? 'LONG ▲' : 'SHORT ▼';
    q('.cl').textContent = '×' + s.L;
    q('.cr').textContent = 'RR ' + s.rr.toFixed(1);
    const ch = q('.ch');
    ch.textContent = s.state === 'tp' ? '✅ هدف خورد' : s.state === 'sl' ? '❌ استاپ خورد' : '';
    ch.style.color = s.state === 'tp' ? 'var(--up)' : 'var(--dn)';
    q('.tt').textContent = `TP · ${sgn(s.tpPct)}% · ${usd(s.tpMoney)}`;
    q('.tl').textContent = `SL · ${sgn(s.slPct)}% · ${usd(s.slMoney)}`;
    const te = q('.te'), m = s.curMoney;
    te.innerHTML = `ورود ${f(it.e)} <span class="${m >= 0 ? 'pg' : 'pr'}">${usd(m)}</span>`;
    el.classList.toggle('hit-tp', s.state === 'tp');
    el.classList.toggle('hit-sl', s.state === 'sl');
  }

  let key = '';
  function upd() {
    const W = ov.clientWidth, H = ov.clientHeight;
    const x1 = fromLogical(logicalOf(it.t0)), x2 = fromLogical(logicalOf(it.t0 + it.dur));
    const yE = candle.priceToCoordinate(it.e), yT = candle.priceToCoordinate(it.t), yS = candle.priceToCoordinate(it.s);
    if (x1 == null || x2 == null || yE == null || yT == null || yS == null || x2 < 0 || x1 > W) { if (el.style.display !== 'none') el.style.display = 'none'; key = ''; return; }
    const k = [x1, x2, yE, yT, yS, W, H].map(v => Math.round(v)).join();
    if (k === key && el.style.display === 'block') return;
    key = k; el.style.display = 'block';
    const w = Math.max(x2 - x1, 2);
    const tr = (e, x, y) => e.style.transform = `translate(${x}px,${y}px)`;
    const zone = (e, a, b) => { tr(e, x1, Math.min(a, b)); e.style.width = w + 'px'; e.style.height = Math.max(Math.abs(a - b), 1) + 'px'; };
    zone(zp, yE, yT); zone(zl, yE, yS);
    [[lp, yT], [le, yE], [ls, yS]].forEach(([e, y]) => { tr(e, x1, y); e.style.width = w + 'px'; });
    const cl = v => Math.max(16, Math.min(H - 16, v));
    const xr = Math.max(Math.min(x2, W), Math.min(160, W)) - 8;
    pt.style.transform = `translate(${xr}px,${cl(yT)}px) translate(-100%,-50%)`;
    ps.style.transform = `translate(${xr}px,${cl(yS)}px) translate(-100%,-50%)`;
    pe.style.transform = `translate(${Math.max(x1, 0) + 8}px,${cl(yE)}px) translate(0,-50%)`;
    const top = Math.min(yT, yS, yE);
    chip.style.transform = `translate(${Math.max(x1, 0) + 6}px,${Math.max(top - 8, 32)}px) translate(0,-100%)`;
  }

  // --- کشیدن دسته‌ها
  function bindDrag(pill, kind) {
    pill.addEventListener('pointerdown', ev => {
      ev.preventDefault(); ev.stopPropagation();
      try { pill.setPointerCapture(ev.pointerId); } catch (e) {}

      const x0 = ev.clientX - r0.left, y0 = ev.clientY - r0.top;
      const p0 = candle.coordinateToPrice(y0), l0 = toLogical(x0);
      pill.classList.add('drag'); tick();
      const mv = e2 => {
        const r = ov.getBoundingClientRect(), x = e2.clientX - r.left, y = e2.clientY - r.top;
        const p1 = candle.coordinateToPrice(y); if (p1 == null || p0 == null) return;
        const dp = p1 - p0, gap = st.e * 0.0002, d = st.t > st.e ? 1 : -1;
        if (kind === 't') { const v = st.t + dp; it.t = rp(d === 1 ? Math.max(v, st.e + gap) : Math.min(v, st.e - gap)); }
        else if (kind === 's') { const v = st.s + dp; it.s = rp(d === 1 ? Math.min(v, st.e - gap) : Math.max(v, st.e + gap)); }
        else {
          it.e = rp(st.e + dp); it.t = rp(st.t + dp); it.s = rp(st.s + dp);
          const l1 = toLogical(x);
          if (l0 != null && l1 != null) it.t0 = timeOfLogical(logicalOf(st.t0) + Math.round(l1 - l0));
        }
        lE.applyOptions({price: it.e}); lT.applyOptions({price: it.t}); lS.applyOptions({price: it.s});
        key = ''; txt(); upd(); renderWallet();
              };
      const up = () => {
        pill.classList.remove('drag');
        pill.removeEventListener('pointermove', mv); pill.removeEventListener('pointerup', up); pill.removeEventListener('pointercancel', up);
        store.set(dkey(), objs.map(o => o.it));
      };
      pill.addEventListener('pointermove', mv); pill.addEventListener('pointerup', up); pill.addEventListener('pointercancel', up);
    });
  }
  bindDrag(pt, 't'); bindDrag(ps, 's'); bindDrag(pe, 'e');
  q('.cx').addEventListener('click', ev => {
    ev.stopPropagation();
    const i = objs.findIndex(o => o.it === it);
    if (i >= 0) { try { objs[i].rm(); } catch (e) {} objs.splice(i, 1); store.set(dkey(), objs.map(o => o.it)); renderWallet(); toast('🗑 باکس حذف شد'); }
  });

  const rm = () => { el.remove(); [lE, lT, lS].forEach(l => { try { candle.removePriceLine(l); } catch (e) {} }); };
  return {rm, upd, txt};
}
function refreshBoxes() { for (const o of objs) if (o.txt) o.txt(); }
(function frame() { for (const o of objs) if (o.upd) o.upd(); requestAnimationFrame(frame); })();
// پهنای محور قیمت و ارتفاع محور زمان رو حساب می‌کنیم تا باکس روی اون‌ها نیفته
setInterval(() => {
  let pw = 56, th = 26;
  try { pw = chart.priceScale('right').width() || pw; } catch (e) {}
  try { th = ts.height() || th; } catch (e) {}
  if (ov.style.right !== pw + 'px') ov.style.right = pw + 'px';
  if (ov.style.bottom !== th + 'px') ov.style.bottom = th + 'px';
}, 400);

function build(it) {
  const line = (p, color, title, style) => candle.createPriceLine({price: p, color, lineWidth: 1, lineStyle: style || 2, axisLabelVisible: true, title});
  if (it.k === 'h') { const h = line(it.p, T.gold, '—'); return {rm: () => candle.removePriceLine(h)}; }
  if (it.k === 'al') { const h = line(it.p, T.alert, '🔔'); return {rm: () => candle.removePriceLine(h)}; }
  if (it.k === 't') {
    const s = chart.addLineSeries({color: T.trend, lineWidth: 2, lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false});
    s.setData([{time: it.t1, value: it.p1}, {time: it.t2, value: it.p2}]);
    return {rm: () => chart.removeSeries(s)};
  }
  if (it.k === 'pos' || it.k === 'rr') return buildBox(it);
  return {rm: () => {}};
}
function addItem(it, save = true) {
  const r = build(it); objs.push({it, rm: r.rm, upd: r.upd, txt: r.txt});
  if (save) store.set(dkey(), objs.map(o => o.it));
  if (r.txt) r.txt(); renderWallet();
}
function restore() { (store.get(dkey(), []) || []).forEach(it => { try { addItem(it, false); } catch (e) {} }); }
function wipeObjs() { objs.forEach(o => { try { o.rm(); } catch (e) {} }); objs = []; }

  $('measure').style.display = 'none';
}

// --- قرار دادن باکس Long/Short با یک لمس
function placeBox(side, price, time) {
  const H = $('chart').clientHeight;
  const a = candle.coordinateToPrice(0), b = candle.coordinateToPrice(H);
  const span = (a != null && b != null) ? Math.abs(a - b) : price * 0.04;
  const risk = Math.max(span * 0.07, price * 0.0005), d = side === 'long' ? 1 : -1;     // اندازه‌ی پیش‌فرض متناسب با چارت
  addItem({k: 'pos', e: rp(price), t: rp(price + d * risk * 2), s: rp(price - d * risk), t0: time, dur: 30 * TF_SEC[tf]});
  haptic('success');
  toast('👆 دایره‌های TP و SL رو بکش تا تنظیم بشن • ورود رو بکش تا کل باکس جابجا بشه', 5000);
}

const HINTS = {
  none: '', h: 'روی چارت بزن تا خط افقی بیاد', t: '📈 نقطه اول خط روند رو بزن',
  m: '📏 نقطه اول اندازه‌گیری رو بزن', al: '🔔 قیمت هشدار رو روی چارت بزن',
  long: '🟢 جای ورود Long رو روی چارت بزن', short: '🔴 جای ورود Short رو روی چارت بزن',
};
function setHint(t) { const h = $('hint'); if (!t) { h.style.display = 'none'; return; } $('hintTxt').textContent = t; h.style.display = 'flex'; }
function setTool(t) {
  tool = t; clearTmp(); hideAlertBar();
  document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  setHint(HINTS[t]);
}
document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool === tool && tool !== 'none' ? 'none' : b.dataset.tool));
$('hintX').onclick = () => setTool('none');

function fmtDur(sec) {
  sec = Math.abs(sec);
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  return (d ? d + ' روز ' : '') + (h ? h + ' ساعت ' : '') + (!d && m ? m + ' دقیقه' : '');
}
chart.subscribeClick(param => {
  if (tool === 'none' || !param.point) return;
  const price = candle.coordinateToPrice(param.point.y);
  if (price == null) return;
  let time = param.time;
  if (time == null && ts.coordinateToTime) time = ts.coordinateToTime(param.point.x);
  if (time == null) time = data[data.length - 1].time;

  if (tool === 'long' || tool === 'short') {
    let l = param.logical; if (l == null) l = toLogical(param.point.x);
    const t0 = l != null ? timeOfLogical(Math.min(l, data.length - 1)) : data[data.length - 1].time;
    const side = tool; setTool('none'); placeBox(side, price, t0); return;
  }
  if (tool === 'h') { addItem({k: 'h', p: price}); setTool('none'); return; }
  if (tool === 'al') {
    pendingAlert = price;
    const cur = data[data.length - 1].close;
    $('alertTxt').textContent = `🔔 ${sym} روی ${f(price)} (${sgn((price - cur) / cur * 100)}% از قیمت فعلی)`;
    $('alertbar').style.display = 'flex';
    return;
  }
  pend.push({time, price});
  tmp.push(candle.createPriceLine({price, color: T.tmp, lineWidth: 1, lineStyle: 1, axisLabelVisible: true, title: '•'}));
  if (pend.length < 2) { setHint(tool === 't' ? '📈 نقطه دوم خط روند رو بزن' : '📏 نقطه دوم رو بزن'); return; }
  const [a, b] = pend;
  if (tool === 't') {
    let [p1, p2] = a.time <= b.time ? [a, b] : [b, a];
    if (p1.time === p2.time) { toast('دو نقطه باید روی دو کندل متفاوت باشن'); clearTmp(); setHint(HINTS.t); return; }
    addItem({k: 't', t1: p1.time, p1: p1.price, t2: p2.time, p2: p2.price});
  } else if (tool === 'm') {
    clearMeasure();
    const [p1, p2] = a.time <= b.time ? [a, b] : [b, a];
    if (p1.time !== p2.time) {
      measureSeries = chart.addLineSeries({color: T.measure, lineWidth: 1, lineStyle: 2, lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false});
      measureSeries.setData([{time: p1.time, value: p1.price}, {time: p2.time, value: p2.price}]);
    }
    const dp = b.price - a.price, pc = dp / a.price * 100, bars = Math.round(Math.abs(b.time - a.time) / TF_SEC[tf]);
    const m = $('measure');
    m.innerHTML = `<b class="${dp >= 0 ? 'g' : 'r'}">${dp >= 0 ? '+' : ''}${f(dp)} (${sgn(pc)}%)</b> • ${bars} کندل • ${fmtDur(b.time - a.time)}`;
    m.style.display = 'block'; m.onclick = clearMeasure;
  }
  setTool('none');
});

$('alNo').onclick = () => { hideAlertBar(); setTool('none'); };

$('bUndo').onclick = () => {
  if (!objs.length) { toast('چیزی برای برگشت نیست'); return; }
  const o = objs.pop(); try { o.rm(); } catch (e) {}
  store.set(dkey(), objs.map(x => x.it)); renderWallet();
};
$('bClear').onclick = () => { wipeObjs(); clearTmp(); clearMeasure(); store.set(dkey(), []); renderWallet(); toast('🗑 همه ترسیم‌های این ارز پاک شد'); };
$('bLast').onclick = () => chart.timeScale().scrollToRealTime();

// ---------- شیت‌ها
function openSheet(id) { $(id).classList.add('open'); }
document.querySelectorAll('.sheet').forEach(s => s.addEventListener('click', e => { if (e.target === s) s.classList.remove('open'); }));
$('bInd').onclick = () => openSheet('indSheet');
document.querySelectorAll('[data-ind]').forEach(c => c.onchange = () => {
  ind[c.dataset.ind] = c.checked; store.set('ind', ind); applyVis();
  if (c.dataset.ind === 'rsi' && c.checked) { fullInd(); const r = chart.timeScale().getVisibleLogicalRange(); if (r) rchart.timeScale().setVisibleLogicalRange(r); }
});
$('coinGrid').innerHTML = [...new Set([...POS.map(p => p.coin), ...COINS])].map(c => `<button data-c="${c}">${c}</button>`).join('');
document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => switchSym(b.dataset.c));
$('symBtn').onclick = () => openSheet('symSheet');
$('symGo').onclick = () => { const v = clean($('symInput').value); if (v) switchSym(v); };
async function switchSym(s) {
  const old = sym; sym = s;
  $('symSheet').classList.remove('open');
  try { await api(`/api/v3/ticker/price?symbol=${s}USDT`); }
  catch (e) { sym = old; toast('❗ این نماد پیدا نشد'); return; }
  store.set('sym', sym); load();
}
$('tfs').innerHTML = TFS.map(t => `<button data-tf="${t}">${t}</button>`).join('');
function markTf() { document.querySelectorAll('[data-tf]').forEach(b => b.classList.toggle('on', b.dataset.tf === tf)); }
document.querySelectorAll('[data-tf]').forEach(b => b.onclick = () => { tf = b.dataset.tf; store.set('tf', tf); markTf(); load(); });

applyTheme(theme, false);
markTf(); applyVis(); renderWallet(); load();
})();
</script>
</body>
</html>
